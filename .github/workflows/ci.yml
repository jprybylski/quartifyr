name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  styling-tests:
    name: styling pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pure Python, no Quarto/R involved -- `uv run` manages its own
      # ephemeral venv from styling/pyproject.toml, so this needs no
      # manual venv setup and works identically on all three platforms.
      - name: Run styling/ pytest suite
        working-directory: styling
        run: uv run --extra dev pytest tests -v

  full-pipeline:
    name: full pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows isn't included here: rv doesn't yet reliably support R
        # 4.6 there -- it refuses to activate its managed library
        # ("R version specified in config (4.5) does not match session
        # version (4.6.1)... entering safe mode"), which then cascades
        # into missing-package errors for everything rv would otherwise
        # provide. Confirmed as a live, currently-unresolved upstream
        # issue (not a quartifyr/CI-script bug): A2-ai/rv#493, where a
        # maintainer notes Windows currently only works reliably with a
        # PPM repository, not plain CRAN. Windows/rv/R-4.6 compatibility
        # is tracked there, not something to work around here by
        # changing real dependency-resolution behavior for a CI job.
        # Windows is still covered by styling-tests above (pure Python,
        # no rv involved).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # System headers rv-managed R packages need to compile from source
      # on a fresh Linux runner (no pre-built binaries the way CRAN's
      # macOS/Windows repos provide) -- libuv for `fs` (a pyro/reportifyr
      # transitive dependency), the rest for ggplot2's own dependency
      # chain (ragg/systemfonts/textshaping/gdtools), which
      # examples/demo-report also needs.
      - name: Install R package system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev

      # Not using rv's own install.sh: its GitHub API call is
      # unauthenticated, which hit GitHub's 60/req-hour unauthenticated
      # limit (shared across the whole runner IP pool) in a real CI run
      # -- confirmed by a run where all 3 retry attempts failed
      # identically within seconds of each other. Querying the release
      # API ourselves with the workflow's own GITHUB_TOKEN (5000
      # req/hour, not shared) sidesteps that.
      - name: Install rv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then arch="aarch64"; fi
          if [ "$os" = "darwin" ]; then os_pattern="apple-darwin"; else os_pattern="unknown-linux-gnu"; fi
          target="${arch}-${os_pattern}"
          asset_url=$(curl -sSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/A2-ai/rv/releases/latest \
            | grep -o "https://github.com/A2-ai/rv/releases/download/[^\"]*${target}\.tar\.gz" | head -1)
          if [ -z "$asset_url" ]; then
            echo "Could not find an rv release asset for target $target" >&2
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o /tmp/rv.tar.gz "$asset_url"
          tar -xzf /tmp/rv.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # reportifyr's context resolution (embedded in report/figure/table
      # metadata) shells out to `git config` and errors if no identity is
      # set -- CI runners have none by default.
      - name: Configure git identity for reportifyr
        run: |
          git config --global user.name "quartifyr CI"
          git config --global user.email "quartifyr-ci@users.noreply.github.com"

      # rv sync below git-clones pyro/reportifyr (both public, no CRAN
      # release -- see r/rproject.toml) anonymously over https. GitHub
      # throttles anonymous git-over-https from the shared GitHub Actions
      # runner IP pool and starts returning 401 ("could not read Username
      # for 'https://github.com': terminal prompts disabled") once that's
      # hit -- the same class of shared-IP rate limiting already worked
      # around above for rv's own release-API call. Authenticating with
      # the workflow's own GITHUB_TOKEN (not shared) avoids it.
      - name: Authenticate anonymous git-over-https to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      # This is the repo-root Quick Start, run exactly as documented, so
      # this job also stands in as a check that the README instructions
      # themselves are correct and current.
      - name: Set up styling/ venv
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e "./styling[dev]"
          quartifyr-styling build --style styling/styles/default.yaml --out templates/org-reference.docx

      - name: rv sync (r/)
        working-directory: r
        run: rv sync

      # Looped rather than a second matrix axis (os x example): only these
      # two steps and the smoke-test step below are per-example -- the
      # rest of this job (rv install, apt deps, git identity, venv+
      # template build) is shared setup that a second matrix dimension
      # would needlessly double for no benefit.
      - name: rv sync (examples/*)
        run: |
          for example in demo-report memo-example; do
            (cd "examples/$example" && rv sync)
          done

      - name: Initialize reportifyr projects (fresh clone -- .report_init.json is gitignored)
        run: |
          for example in demo-report memo-example; do
            (cd "examples/$example" && Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())')
          done

      # The render_report()/r/ convenience-wrapper path.
      - name: Run example smoke tests
        run: |
          source .venv/bin/activate
          python3 examples/demo-report/smoke_test.py
          python3 examples/memo-example/smoke_test.py

      # The decomposed "Using the pieces directly" path from the
      # repo-root README -- proves that documentation is actually true,
      # not just written down.
      - name: Run bare-bones pieces-only integration test
        run: |
          source .venv/bin/activate
          python3 scripts/bare_bones_integration_test.py
