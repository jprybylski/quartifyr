name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  styling-tests:
    name: styling pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pure Python, no Quarto/R involved -- `uv run` manages its own
      # ephemeral venv from styling/pyproject.toml, so this needs no
      # manual venv setup and works identically on all three platforms.
      - name: Run styling/ pytest suite
        working-directory: styling
        run: uv run --extra dev pytest tests -v

  full-pipeline:
    name: full pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Git Bash on windows-latest runners, so every `run:` step below can
    # use the same bash syntax (for-loops, `source`, `[ ... ]`) across all
    # three platforms without per-step `shell:` overrides.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Runs before any R/uv/rv setup below, on purpose: it needs nothing
      # but `quarto` itself (plus templates/org-reference.docx, committed
      # to the repo -- see scripts/check_template_freshness.py) and plain
      # stdlib Python, so this placement is itself proof that the
      # Quarto-only shell-render path has no R or Python dependency of
      # its own.
      - name: Run Quarto-only shell-render check (no R, no Python venv)
        run: python3 scripts/quarto_only_smoke_test.py

      # Matches r_version in r/rproject.toml and both examples' -- see
      # those files' comments on why it's pinned to 4.5, not the latest
      # release.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # System headers rv-managed R packages need to compile from source
      # on a fresh Linux runner (no pre-built binaries the way CRAN's
      # macOS/Windows repos provide) -- libuv for `fs` (a pyro/reportifyr
      # transitive dependency), the rest for ggplot2's own dependency
      # chain (ragg/systemfonts/textshaping/gdtools), which
      # examples/demo-report also needs.
      - name: Install R package system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev

      # Uses the maintained a2-ai/setup-rv action (also what reportifyr's
      # own CI uses) rather than a hand-rolled release download: it covers
      # Windows's differently-named/zipped asset for free, and its
      # `github-token` input (defaulted to `github.token`) already avoids
      # the unauthenticated-GitHub-API rate limiting a hand-rolled
      # install.sh call hits (60 req/hour, shared across the whole runner
      # IP pool) -- previously worked around here with a bespoke
      # authenticated curl call; that workaround is now upstream instead.
      - uses: a2-ai/setup-rv@main

      # PPM ships prebuilt Windows binaries; plain CRAN only ships source
      # on Windows for many packages, which needs a matching Rtools/gcc
      # toolchain and has been a source of compile failures there (see
      # r/README.md's Windows section for specifics). reportifyr's own CI
      # (A2-ai/reportifyr's R-CMD-check.yaml) uses this same
      # prepend-PPM-on-Windows pattern successfully. `rv configure`
      # rewrites the rproject.toml in the current directory (or
      # `-c`'s target), not a global rv config, so it has to run once per
      # project -- r/ and both examples each carry their own rproject.toml.
      - name: Prepend PPM repository (Windows)
        if: runner.os == 'Windows'
        run: |
          for config in r/rproject.toml examples/demo-report/rproject.toml examples/memo-example/rproject.toml; do
            rv configure repository add PPM --url https://packagemanager.posit.co/cran/latest --first -c "$config"
          done

      # reportifyr's context resolution (embedded in report/figure/table
      # metadata) shells out to `git config` and errors if no identity is
      # set -- CI runners have none by default.
      - name: Configure git identity for reportifyr
        run: |
          git config --global user.name "quartifyr CI"
          git config --global user.email "quartifyr-ci@users.noreply.github.com"

      # rv sync below git-clones pyro/reportifyr (both public, no CRAN
      # release -- see r/rproject.toml) anonymously over https. GitHub
      # throttles anonymous git-over-https from the shared GitHub Actions
      # runner IP pool and starts returning 401 ("could not read Username
      # for 'https://github.com': terminal prompts disabled") once that's
      # hit -- the same class of shared-IP rate limiting already worked
      # around above for rv's own release-API call. Authenticating with
      # the workflow's own GITHUB_TOKEN (not shared) avoids it.
      - name: Authenticate anonymous git-over-https to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      # This is the repo-root Quick Start, run exactly as documented, so
      # this job also stands in as a check that the README instructions
      # themselves are correct and current. Building templates/
      # org-reference.docx isn't part of that anymore -- it's committed to
      # the repo now (see scripts/check_template_freshness.py); each
      # example's smoke_test.py already verifies it hasn't gone stale.
      - name: Set up styling/ venv
        run: |
          uv venv .venv --python 3.12
          # Windows venvs use Scripts/, not bin/ -- recorded once here so
          # every later step that needs the venv can `source
          # "$VENV_ACTIVATE"` without repeating the OS branch.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VENV_ACTIVATE=.venv/Scripts/activate" >> "$GITHUB_ENV"
          else
            echo "VENV_ACTIVATE=.venv/bin/activate" >> "$GITHUB_ENV"
          fi
          source .venv/*/activate
          uv pip install -e "./styling[dev]"

      - name: rv sync (r/)
        working-directory: r
        run: rv sync

      # Looped rather than a second matrix axis (os x example): only these
      # two steps and the smoke-test step below are per-example -- the
      # rest of this job (rv install, apt deps, git identity, venv setup)
      # is shared setup that a second matrix dimension would needlessly
      # double for no benefit.
      - name: rv sync (examples/*)
        run: |
          for example in demo-report memo-example; do
            (cd "examples/$example" && rv sync)
          done

      - name: Initialize reportifyr projects (fresh clone -- .report_init.json is gitignored)
        run: |
          for example in demo-report memo-example; do
            (cd "examples/$example" && Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())')
          done

      # The render_report()/r/ convenience-wrapper path.
      - name: Run example smoke tests
        run: |
          source "$VENV_ACTIVATE"
          python3 examples/demo-report/smoke_test.py
          python3 examples/memo-example/smoke_test.py

      # The decomposed "Using the pieces directly" path from the
      # repo-root README -- proves that documentation is actually true,
      # not just written down.
      - name: Run bare-bones pieces-only integration test
        run: |
          source "$VENV_ACTIVATE"
          python3 scripts/bare_bones_integration_test.py
