name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  styling-tests:
    name: styling pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pure Python, no Quarto/R involved -- `uv run` manages its own
      # ephemeral venv from styling/pyproject.toml, so this needs no
      # manual venv setup and works identically on all three platforms.
      - name: Run styling/ pytest suite
        working-directory: styling
        run: uv run --extra dev pytest tests -v

  full-pipeline:
    name: full pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # System headers rv-managed R packages need to compile from source
      # on a fresh Linux runner (no pre-built binaries the way CRAN's
      # macOS/Windows repos provide) -- libuv for `fs` (a pyro/reportifyr
      # transitive dependency), the rest for ggplot2's own dependency
      # chain (ragg/systemfonts/textshaping/gdtools), which
      # examples/demo-report also needs.
      - name: Install R package system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev

      # `rv`'s own install script only targets macOS/Linux (confirmed by
      # reading it -- on Windows it falls through to an "unknown OS,
      # defaulting to linux-gnu target" branch and fetches the wrong
      # binary). Windows gets its own step: download the released
      # x86_64-pc-windows-msvc.zip directly and put it on PATH.
      # install.sh's own GitHub API call is unauthenticated and has hit
      # GitHub's unauthenticated rate limit in real CI runs (shared
      # runner IP pools); a few retries is a pragmatic mitigation since
      # the script itself can't be handed a token.
      - name: Install rv (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          for i in 1 2 3; do
            curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash && break
            echo "rv install attempt $i failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Windows isn't covered by install.sh (confirmed by reading it --
      # it falls through to an "unknown OS, defaulting to linux-gnu
      # target" branch there and fetches the wrong binary), so this
      # queries the release API directly. Authenticated with the
      # workflow's own GITHUB_TOKEN (5000 req/hour) rather than
      # unauthenticated (60/hour, shared across the whole runner IP
      # pool) -- the same rate limit that made the macOS/Linux install
      # flaky enough to need retries above.
      - name: Install rv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/A2-ai/rv/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*x86_64-pc-windows-msvc.zip" }
          $dest = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\rv.zip"
          Expand-Archive -Path "$env:TEMP\rv.zip" -DestinationPath $dest -Force
          echo "$dest" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # reportifyr's context resolution (embedded in report/figure/table
      # metadata) shells out to `git config` and errors if no identity is
      # set -- CI runners have none by default.
      - name: Configure git identity for reportifyr
        run: |
          git config --global user.name "quartifyr CI"
          git config --global user.email "quartifyr-ci@users.noreply.github.com"

      # This is the repo-root Quick Start, run exactly as documented, so
      # this job also stands in as a check that the README instructions
      # themselves are correct and current. `shell: bash` throughout
      # (including on Windows, via the Git Bash that windows-latest
      # runners already ship) so the venv-activate path is the only
      # OS-specific bit, rather than duplicating every step in pwsh too.
      - name: Set up styling/ venv
        shell: bash
        run: |
          uv venv .venv --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          uv pip install -e "./styling[dev]"
          quartifyr-styling build --style styling/styles/default.yaml --out templates/org-reference.docx

      # shell: bash even on Windows -- PowerShell ships a built-in `rv`
      # alias for Remove-Variable that shadows our downloaded rv.exe on
      # PATH, confirmed by a real CI failure ("Cannot find a variable
      # with the name 'sync'"). Bash (Git Bash, already on windows-latest
      # runners) has no such alias and resolves `rv` via PATH normally.
      - name: rv sync (r/)
        working-directory: r
        shell: bash
        run: rv sync

      - name: rv sync (examples/demo-report)
        working-directory: examples/demo-report
        shell: bash
        run: rv sync

      - name: Initialize reportifyr project (fresh clone -- .report_init.json is gitignored)
        working-directory: examples/demo-report
        run: Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())'

      # The render_report()/r/ convenience-wrapper path.
      - name: Run demo smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python3 examples/demo-report/smoke_test.py

      # The decomposed "Using the pieces directly" path from the
      # repo-root README -- proves that documentation is actually true,
      # not just written down.
      - name: Run bare-bones pieces-only integration test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python3 scripts/bare_bones_integration_test.py
