name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-run for a dependabot/combined-prs branch skipped below

# The CRAN snapshot the examples' renv.lock files were taken from. Restores
# must resolve against it, not Posit Package Manager's moving "latest":
# once latest moves past a pinned version, renv fetches the old one from the
# CRAN archive, and renv (1.2.3 and 1.3.1) then mishandles any such package
# that declares no `Imports:` (curl): in project mode it fills the missing
# field from the project's own DESCRIPTION, so curl appears to import
# reportifyr, which loops back to curl via gert and credentials. renv then
# reports reportifyr, gert, credentials and curl as "dependency failed" with
# no real error. Bump this together with re-snapshotting the lock files.
env:
  CRAN_SNAPSHOT_URL: https://packagemanager.posit.co/cran/2026-09-01

jobs:
  styling-tests:
    name: styling pytest (${{ matrix.os }})
    # Dependabot PRs and the github/combine-prs-generated combined PR (see
    # combine-prs.yml) don't get automatic checks -- individually, they're
    # too numerous to burn the full matrix on for a routine dependency
    # bump; the combined PR runs manually (workflow_dispatch above) before
    # merge instead. Any other PR is untouched.
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'dependabot/') && github.head_ref != 'combined-prs-branch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pure Python, no Quarto/R involved -- `uv run` manages its own
      # ephemeral venv from the repo-root pyproject.toml (Python source is
      # canonical under inst/python/, see DESCRIPTION/R/run-python.R), so
      # this needs no manual venv setup and works identically on all three
      # platforms.
      - name: Run styling engine pytest suite
        run: uv run --extra dev pytest tests/python -v

  full-pipeline:
    name: full pipeline (${{ matrix.os }})
    # See styling-tests' identical condition above.
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'dependabot/') && github.head_ref != 'combined-prs-branch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Guarantees a `python3` on PATH before any venv exists (needed by
      # the Quarto-only check right below) -- Linux/macOS runner images
      # already have one, but Windows' hosted image doesn't reliably
      # provide `python3` (only `python`) without this.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      # Runs before any R/uv setup below, on purpose: it needs nothing but
      # `quarto` itself (plus templates/org-reference.docx, committed to
      # the repo -- see scripts/check_template_freshness.py) and plain
      # stdlib Python, so this placement is itself proof that the
      # Quarto-only shell-render path has no R or Python dependency of
      # its own.
      - name: Run Quarto-only shell-render check (no R, no Python venv)
        run: python3 scripts/quarto_only_smoke_test.py

      # Also here, not after R/uv setup: proves `quarto add
      # jprybylski/quartifyr` (the README's standalone install path,
      # issue #16) actually works against this PR's own tree, using
      # nothing but `quarto` and `git`.
      - name: Run quarto add smoke test (repo-root extension host)
        run: python3 scripts/quarto_add_smoke_test.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      # setup-r's use-public-rspm default points RENV_CONFIG_REPOS_OVERRIDE
      # at Posit Package Manager only. renv::restore() prioritizes that env
      # var over renv.lock's own Repositories, so left alone it silently
      # drops a2-ai.r-universe.dev -- reportifyr/pyro's actual source --
      # from every repos-based lookup for the rest of this job. Re-add it
      # so restore resolves reportifyr/pyro from r-universe the same way
      # local dev does.
      - name: Restore a2-ai.r-universe.dev to the effective repos list
        shell: bash
        run: echo "RENV_CONFIG_REPOS_OVERRIDE=a2-ai=https://a2-ai.r-universe.dev;CRAN=$CRAN_SNAPSHOT_URL" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runtime/build libraries the Ubuntu R binaries below need -- libuv
      # for `fs` (a pyro/reportifyr transitive dependency), libgit2 for
      # `gert` (a pyro dependency; without it, loading gert fails with
      # "libgit2.so.1.7: cannot open shared object file", confirmed via a
      # real CI run -- Posit's Ubuntu binary repo assumes it's already on
      # the system, it doesn't bundle it), the rest for ggplot2's own
      # dependency chain (ragg/systemfonts/textshaping/gdtools), which
      # examples/demo-report also needs.
      - name: Install R package system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libgit2-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev

      # CRAN/PPM's macOS gdtools binary (a ggplot2/flextable dependency, via
      # reportifyr) links against /opt/X11/lib/libXrender.1.dylib and friends
      # -- confirmed present even in older dated PPM snapshots, so this isn't
      # a gdtools regression. GitHub's macos-latest image stopped providing
      # that shim (observed switching between two otherwise-identical CI runs
      # a few hours apart), so provide it explicitly rather than depend on
      # the runner image continuing to bundle it.
      - name: Install XQuartz (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      # reportifyr's context resolution (embedded in report/figure/table
      # metadata) shells out to `git config` and errors if no identity is
      # set -- CI runners have none by default.
      - name: Configure git identity for reportifyr
        run: |
          git config --global user.name "quartifyr CI"
          git config --global user.email "quartifyr-ci@users.noreply.github.com"

      # This is the repo-root Quick Start, run exactly as documented, so
      # this job also stands in as a check that the README instructions
      # themselves are correct and current. Building inst/templates/
      # org-reference.docx isn't part of that anymore -- it's committed to
      # the repo now (see scripts/check_template_freshness.py); each
      # example's smoke_test.py already verifies it hasn't gone stale. This
      # .venv is still needed (separate from renv::install() below, which
      # is a per-project pyro-managed venv) because scripts/
      # check_template_freshness.py and scripts/bare_bones_integration_
      # test.py shell out to a literal .venv/bin/quartifyr-styling path
      # directly, not through pyro.
      #
      # `--python .venv` targets the venv directly instead of activating
      # it -- avoids the bin/ vs Scripts/ split between platforms.
      - name: Set up Python venv
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -e '.[dev]'

      # Two explicit steps rather than a loop over both examples: a shell
      # loop's syntax isn't portable across bash (Linux/macOS default) and
      # PowerShell (Windows default), and there's little to gain from a
      # loop over just two entries.
      - name: renv restore (examples/demo-report)
        working-directory: examples/demo-report
        run: Rscript -e 'renv::restore()'

      - name: renv restore (examples/memo-example)
        working-directory: examples/memo-example
        run: Rscript -e 'renv::restore()'

      # Installed into each example's own renv library (not a shared/global
      # one) via renv::install("local::...") so render.R's `library(quartifyr)`
      # finds it once renv activates that project's own .Rprofile -- renv
      # isolates the library path when active, same reasoning as action.yml's
      # identically-named step. QUARTIFYR_SRC is passed via env, not inlined
      # into the -e string directly: github.workspace is backslash-separated
      # on Windows, and R's string-literal parser treats an embedded
      # `${{ github.workspace }}` substitution's backslashes as escape
      # sequences (confirmed via a real CI run: "'\q' is an unrecognized
      # escape in character string") -- Sys.getenv() sidesteps that
      # entirely since env var values aren't escape-parsed.
      - name: Install quartifyr (examples/demo-report)
        working-directory: examples/demo-report
        env:
          QUARTIFYR_SRC: ${{ github.workspace }}
        run: Rscript -e 'renv::install(paste0("local::", Sys.getenv("QUARTIFYR_SRC")))'

      - name: Install quartifyr (examples/memo-example)
        working-directory: examples/memo-example
        env:
          QUARTIFYR_SRC: ${{ github.workspace }}
        run: Rscript -e 'renv::install(paste0("local::", Sys.getenv("QUARTIFYR_SRC")))'

      - name: Initialize reportifyr project (demo-report, fresh clone -- .report_init.json is gitignored)
        working-directory: examples/demo-report
        run: Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())'

      - name: Initialize reportifyr project (memo-example, fresh clone -- .report_init.json is gitignored)
        working-directory: examples/memo-example
        run: Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())'

      - name: Initialize quartifyr project (demo-report)
        working-directory: examples/demo-report
        run: Rscript -e 'quartifyr::initialize_quartifyr_project(getwd())'

      - name: Initialize quartifyr project (memo-example)
        working-directory: examples/memo-example
        run: Rscript -e 'quartifyr::initialize_quartifyr_project(getwd())'

      # The render_report() convenience-wrapper path (quartifyr R package).
      # `uv run` resolves
      # the repo-root .venv set up above regardless of platform, same as
      # the styling-tests job above -- no manual activation needed. `python`,
      # not `python3`: confirmed via a real CI run that a Windows venv only
      # provides `python.exe`, not `python3.exe`, so `uv run python3 ...`
      # silently fell through to the system interpreter from
      # actions/setup-python above (no python-docx there) instead of the
      # venv's.
      - name: Run example smoke tests
        run: |
          uv run python examples/demo-report/smoke_test.py
          uv run python examples/memo-example/smoke_test.py

      # The decomposed "Using the pieces directly" path from the
      # repo-root README -- proves that documentation is actually true,
      # not just written down.
      - name: Run bare-bones pieces-only integration test
        run: uv run python scripts/bare_bones_integration_test.py

      # The R tests validate hand-built result objects against the v1 schema;
      # this checks what the noninteractive script really prints, for a
      # success and for a forced failure.
      - name: Validate real render.R --json output against the v1 schema
        shell: bash
        run: |
          (
            cd examples/demo-report
            script="$(Rscript -e 'cat(system.file("scripts", "render.R", package = "quartifyr"))')"
            Rscript "$script" --project . --shell report.qmd --status final --json --strict \
              > "$RUNNER_TEMP/render-ok.json"
            code=0
            Rscript "$script" --project . --shell report.qmd --reference-doc does-not-exist.docx --json \
              > "$RUNNER_TEMP/render-failed.json" || code=$?
            test "$code" -eq 1
          )
          uv run python scripts/validate_render_result.py \
            "$RUNNER_TEMP/render-ok.json=ok" "$RUNNER_TEMP/render-failed.json=error"

  offline-pipeline:
    name: offline init + render (no network)
    # Proves quartifyr's setup and render work with no network at all, as in
    # a firewalled (GxP) environment. Everything that needs the network
    # happens first, in "Provision (online)": renv restore, installing this
    # checkout, and initializing the reportifyr and quartifyr Python
    # environments, which leaves the wheels in uv's cache. The check itself
    # then runs in a fresh network namespace (`unshare --net`, which needs
    # root, hence sudo, and then drops back to this user) with an empty
    # HOME, so anything that reaches for the network fails, and anything
    # written to ~/.local/bin (where pyro's uv_setup.sh would install uv) is
    # caught. See scripts/offline_pipeline_check.sh for the steps.
    #
    # See styling-tests' identical condition above.
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'dependabot/') && github.head_ref != 'combined-prs-branch')
    runs-on: ubuntu-latest
    steps:
      # Explicit locations, so the offline phase, which runs with a
      # different HOME, finds what the online phase provisioned. Set from a
      # step rather than a job-level `env:` because the `runner` context
      # isn't available there (the whole workflow is rejected if it's used).
      - name: Pin tool cache locations
        run: |
          {
            echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python"
            echo "RENV_PATHS_CACHE=$RUNNER_TEMP/renv-cache"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      # See full-pipeline's identically-named step.
      - name: Restore a2-ai.r-universe.dev to the effective repos list
        run: echo "RENV_CONFIG_REPOS_OVERRIDE=a2-ai=https://a2-ai.r-universe.dev;CRAN=$CRAN_SNAPSHOT_URL" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7

      # See full-pipeline's identically-named step.
      - name: Install R package system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libgit2-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev

      - name: Configure git identity for reportifyr
        run: |
          git config --global user.name "quartifyr CI"
          git config --global user.email "quartifyr-ci@users.noreply.github.com"

      - name: Provision (online)
        working-directory: examples/demo-report
        env:
          QUARTIFYR_SRC: ${{ github.workspace }}
        run: |
          Rscript -e 'renv::restore()'
          Rscript -e 'renv::install(paste0("local::", Sys.getenv("QUARTIFYR_SRC")))'
          Rscript -e 'reportifyr::initialize_report_project(project_dir = getwd())'
          Rscript -e 'quartifyr::initialize_quartifyr_project(getwd())'

      # Installed now, while the network is up, so the offline check can
      # validate its own render.R --json output against the v1 schema.
      - name: Install a JSON-schema validator for the offline check
        run: python3 -m pip install --quiet --target "$RUNNER_TEMP/jsonschema" jsonschema

      - name: Initialize and render with the network disabled
        run: |
          offline_home="$(mktemp -d)"
          sudo -E unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" HOME="$offline_home" SCHEMA_PYTHONPATH="$RUNNER_TEMP/jsonschema" \
            bash scripts/offline_pipeline_check.sh

  action-smoke-test:
    name: composite action smoke test (dogfood)
    # Exercises action.yml (the repo-root reusable action from issue #9)
    # against examples/demo-report, the same way an external repo would
    # `uses: jprybylski/quartifyr@<ref>` it. Single-OS: the underlying
    # render_report() pipeline is already proven cross-OS by
    # full-pipeline above -- this job's job is to prove the action's own
    # wiring (inputs/outputs/steps), which is OS-agnostic logic lifted
    # straight from that job.
    #
    # See styling-tests' identical condition above.
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'dependabot/') && github.head_ref != 'combined-prs-branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render examples/demo-report via the composite action
        id: render
        uses: ./
        with:
          shell-qmd: examples/demo-report/report.qmd
          final: 'true'
          cran-repo: ${{ env.CRAN_SNAPSHOT_URL }}

      - name: Assert rendered docx exists with no leftover magic strings
        shell: bash
        run: |
          test -f "${{ steps.render.outputs.shell-docx }}"
          test -f "${{ steps.render.outputs.draft-docx }}"
          test -f "${{ steps.render.outputs.final-docx }}"
          # reportifyr::build_report() (draft) intentionally leaves {rpfy}:
          # magic strings in place -- as their own visible-text paragraph
          # (per render_report.R's "Known upstream gotcha" section) and as
          # [hash:...]-suffixed image/table descr/tblDescription attributes
          # for change detection on re-renders -- and only strips the
          # visible-text ones via finalize_document() (see reportifyr's own
          # ?finalize_document: "removing magic strings and bookmarks"). So
          # this must check the *final* docx, and only its visible <w:t>
          # text -- the [hash:...] description attributes are reportifyr's
          # own tracking metadata and persist by design even in report/final/.
          if unzip -p "${{ steps.render.outputs.final-docx }}" word/document.xml \
            | grep -oP '<w:t[^>]*>[^<]*</w:t>' | grep -q '{rpfy}:'; then
            echo "Leftover {rpfy}: magic string in rendered final docx" >&2
            exit 1
          fi
