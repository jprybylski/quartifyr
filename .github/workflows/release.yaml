# Release-on-merge automation, driven by the VERSION file (see
# .github/scripts/sync-release-metadata.R). Never touches CRAN - only
# creates/refreshes a GitHub release and tag, and syncs DESCRIPTION/NEWS.md
# to match VERSION.
#
# Ported from ../xpose.xtras's .github/workflows/release.yaml. `main` is now
# a protected branch (a "basic" ruleset requiring changes via PR, added
# 2026-08-16), so the default GITHUB_TOKEN can't push the metadata-sync
# commit/tag directly -- the deploy-key/SSH push steps below go over SSH
# using a deploy key (`RELEASE_DEPLOY_KEY`) that's on the ruleset's bypass
# list, same as xpose.xtras's own master ruleset.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview version detection/changelog without writing, tagging, or publishing anything"
        type: boolean
        default: true

name: release.yaml

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      # How long after publication an existing release may still be refreshed
      # (tag moved, tarball replaced). A version number must name exactly one
      # source tree and one tarball, because downstream installers pin a
      # version plus a SHA-256; the window only leaves room for a small fix
      # right after a release. Past it, bump VERSION instead.
      REFRESH_WINDOW_HOURS: "24"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # main is protected (requires a PR); the default GITHUB_TOKEN can't
      # push to it directly, so the metadata commit and tag moves below go
      # over SSH using a deploy key that's on the ruleset's bypass list.
      - name: Load deploy key
        if: env.DRY_RUN != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Push over SSH via the deploy key
        if: env.DRY_RUN != 'true'
        run: |
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Runtime/build libraries reportifyr/pyro's own transitive dependencies
      # need against Ubuntu's binary R packages -- same as ci.yml's
      # full-pipeline job and pages.yml's pkgdown build.
      - name: Install R package system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libgit2-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Add Additional_repositories from DESCRIPTION (pyro/reportifyr via a2-ai.r-universe.dev)
        run: |
          raw <- read.dcf("DESCRIPTION", fields = "Additional_repositories")[1, 1]
          if (!is.na(raw) && nzchar(raw)) {
            repos <- trimws(strsplit(raw, ",")[[1]])
            cat(sprintf("options(repos = c(getOption('repos'), %s))\n", deparse(repos)),
                file = path.expand("~/.Rprofile"), append = TRUE)
          }
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Sync release metadata (DESCRIPTION/NEWS.md) to VERSION
        id: sync
        run: Rscript .github/scripts/sync-release-metadata.R

      # An ordinary merge to main that doesn't bump VERSION lands here with
      # VERSION still equal to the latest tag. Inside the window that is a
      # small follow-up fix and is refreshed; after it, the release is left
      # alone (nothing is committed, tagged or uploaded) and a warning says so.
      - name: Leave an old release alone
        id: window
        run: |
          tag="${{ steps.sync.outputs.tag }}"
          if [ "${{ steps.sync.outputs.action }}" = "new" ]; then
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists, refusing to create a second release for it."
              exit 1
            fi
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published="$(gh release view "$tag" --json publishedAt -q .publishedAt)"
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 3600 ))
          echo "Release $tag was published $published (${age_hours}h ago); refresh window is ${REFRESH_WINDOW_HOURS}h."
          if [ "$age_hours" -ge "$REFRESH_WINDOW_HOURS" ]; then
            echo "::warning::VERSION still names the released $tag, outside the ${REFRESH_WINDOW_HOURS}h refresh window, so no release was changed. Refreshing would move the tag and replace the tarball, making one version name two packages. Bump VERSION to publish this change."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release metadata changes
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.window.outputs.blocked != 'true'
        run: |
          git commit -am "chore: sync release metadata for ${{ steps.sync.outputs.version }}"
          git push origin HEAD:main

      - name: Check whether this commit is already released
        id: check
        if: env.DRY_RUN != 'true'
        run: |
          if [ "${{ steps.window.outputs.blocked }}" = "true" ]; then
            echo "Release left alone (see the previous step)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          already_tagged="$(git rev-parse -q --verify "refs/tags/${{ steps.sync.outputs.tag }}" || true)"
          if [ "${{ steps.sync.outputs.changed }}" = "false" ] && [ "$already_tagged" = "$(git rev-parse HEAD)" ]; then
            echo "This commit's metadata already matches VERSION and the tag already points here - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package tarball
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true'
        run: R CMD build . --compact-vignettes=gs+qpdf

      # Lets a consumer that pins version + hash verify the asset, and see at
      # a glance if it ever changes.
      - name: Write SHA256SUMS
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true'
        run: sha256sum "${{ steps.sync.outputs.tarball }}" | tee SHA256SUMS

      - name: Create release
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true' && steps.sync.outputs.action == 'new'
        run: |
          gh release create "${{ steps.sync.outputs.tag }}" \
            "${{ steps.sync.outputs.tarball }}" SHA256SUMS \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.sync.outputs.tag }}" \
            --notes-file changelog.md

      - name: Refresh existing release
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true' && steps.sync.outputs.action == 'refresh'
        run: |
          git tag -f "${{ steps.sync.outputs.tag }}" "$(git rev-parse HEAD)"
          git push origin "${{ steps.sync.outputs.tag }}" --force
          gh release edit "${{ steps.sync.outputs.tag }}" --notes-file changelog.md
          gh release upload "${{ steps.sync.outputs.tag }}" "${{ steps.sync.outputs.tarball }}" SHA256SUMS --clobber
