name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '_pkgdown.yml'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight one finish rather than cancelling it, since
# cancelling a live Pages deploy mid-upload can leave the site in a half-updated state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-pandoc@v2

      # Same libuv/libgit2 dependency reportifyr/pyro need on Ubuntu binary
      # R packages as ci.yml's full-pipeline job -- pkgdown::build_site()
      # below loads the quartifyr package (and therefore its Imports:
      # pyro/reportifyr) to build the reference index.
      - name: Install R package system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libgit2-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      # The repo-root .Rprofile adds a2-ai.r-universe.dev to options(repos=)
      # automatically once R starts here, so pak resolves pyro/reportifyr
      # (no CRAN release for either) the same way local dev does -- picked
      # up by setup-r-dependencies@v2's own Rscript invocation below the
      # same way it was by this step's own former plain `Rscript -e` calls,
      # since neither runs with --vanilla/--no-init-file.
      #
      # r-lib/actions/setup-r-dependencies@v2 (the same action
      # ../R-CMD-check.yaml/../test-coverage.yaml already use for their own
      # dependency installs) resolves and caches this via pak's own binary
      # cache, keyed on DESCRIPTION -- replacing a hand-rolled
      # `pak::pkg_install(..., dependencies = TRUE)` that reinstalled
      # everything, including rebuilding reportifyr/pyro from source, on
      # every single doc deploy. `needs: website` is the canonical
      # r-lib/actions value for a pkgdown build (mirrors
      # usethis::use_pkgdown_github_pages()'s own generated workflow) --
      # pulls in Suggests: rmarkdown (needed to render vignettes/articles)
      # alongside quartifyr's own Imports.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
