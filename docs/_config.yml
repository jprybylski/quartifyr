title: quartifyr
description: "A code-first system for generating standardized scientific/regulated documents with Quarto."
baseurl: "/quartifyr"
url: "https://jprybylski.github.io"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: nil
search_enabled: true
heading_anchors: true

mermaid:
  version: "10.9.1"

aux_links:
  "quartifyr on GitHub":
    - "https://github.com/jprybylski/quartifyr"

aux_links_new_tab: true

footer_content: "quartifyr is maintained at <a href=\"https://github.com/jprybylski/quartifyr\">github.com/jprybylski/quartifyr</a>."

# GitHub Pages' Jekyll build only allows plugins from its supported-gems allowlist, which
# includes jekyll-remote-theme - so this builds with no local Ruby toolchain, same as a plain
# "point Pages at /docs" setup. See https://pages.github.com/versions/ for the allowlist.
