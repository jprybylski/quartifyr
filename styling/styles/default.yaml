# Default quartifyr style preset: Times New Roman, black text, flat/neutral
# tables — a plain "professional industrial" look with no brand color baked
# in. Per-org looks are a second YAML deep-merged over this one (see
# quartifyr_styling.schema.StyleConfig.load), so branding a new org is a
# YAML diff, not a round of clicking through Word's style pane.

fonts:
  body: "Times New Roman"
  heading: "Times New Roman"
  monospace: "Courier New"
  sizes:
    body: 11
    title: 26
    subtitle: 16
    heading:
      1: 16
      2: 14
      3: 12
      4: 11
      5: 11
      6: 11
    caption: 10
    footnote: 9
    toc: 11

colors:
  text: "#000000"
  heading: "#000000"
  title: "#000000"
  caption: "#000000"
  table_header_fill: "#D9D9D9"
  table_border: "#000000"
  rule: "#000000"

page:
  size: "letter"
  margins_in:
    top: 1
    bottom: 1
    left: 1
    right: 1

paragraph:
  line_spacing: 1.15
  space_after_pt: 8
  # "left" is the safe default -- reportifyr's own auto-generated
  # Source/Notes/Abbreviations footnote paragraphs (external, pass 2) have
  # no named style of their own and always inherit whatever alignment
  # "Normal" carries here, with no hook for quartifyr to override just
  # those paragraphs (see quartifyr issue #10's discussion). "justify"
  # reads well for flowing body/synopsis prose but stretches those
  # short, w:br-separated footnote lines into uneven "rivers" of
  # whitespace, so it's opt-in via an org's own style YAML rather than
  # the shipped default.
  alignment: "left"

heading:
  bold: true
  space_before_pt: 12
  space_after_pt: 6
  keep_with_next: true

table:
  style: "Table Grid"
  header_bold: true
  banding: false

# "Synopsis Label"/"Synopsis Value" paragraph styles (see build_template.py):
# a definition-list look -- bold label line, indented value line(s) beneath
# it, small gap between a label and its own value but a full gap before the
# next label -- for the synopsis section without a real Word table. Omit
# `alignment` (as here) to inherit paragraph.alignment instead of overriding
# it just for synopsis values.
synopsis:
  label_space_before_pt: 12
  label_space_after_pt: 2
  value_space_after_pt: 2
  value_indent_in: 0.25

title_page:
  show_rule_under_title: true
  fields:
    - report_type
    - title
    - subtitle
    - date
    - lead_scientist
    - version
    - confidentiality

footer:
  show_page_number: true
  text: ""

identity:
  org_name: ""
  logo_path: ""
