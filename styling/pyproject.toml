[project]
name = "quartifyr-styling"
version = "0.1.0"
description = "Code-first docx reference-template and abbreviations generation for quartifyr report shells"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quartifyr-styling = "quartifyr_styling.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quartifyr_styling*"]
