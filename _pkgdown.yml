url: https://jprybylski.github.io/quartifyr/

title: quartifyr

template:
  bootstrap: 5
  bslib:
    primary: "#0054AD"
  includes:
    # pkgdown's own markdown renderer already emits `<pre class="mermaid">`
    # for ```mermaid fenced code blocks (confirmed in a local
    # pkgdown::build_home() run) -- that's the exact markup mermaid.js
    # looks for, but pkgdown doesn't bundle or load mermaid.js itself
    # outside of Quarto-authored vignettes (which render diagrams to
    # static SVG at build time instead, see `vignette("quarto", "pkgdown")`).
    # README.md's diagram isn't Quarto-authored, so it needs the JS library
    # loaded client-side here for GitHub Pages to render it the same way
    # GitHub's own README preview already does.
    #
    # mermaid.js's own run()/startOnLoad reads each `.mermaid` element's
    # innerHTML (confirmed in mermaid.core.mjs) -- but pkgdown's markup
    # nests a `<code>` child inside `<pre class="mermaid">` (standard
    # pandoc/commonmark fenced-code-block output), so that innerHTML is
    # literally "<code>flowchart LR...</code>", not the diagram source,
    # which mermaid's parser rejects with "Syntax error in text" (confirmed
    # against a real deployed page). Unwrap the nested <code> into plain
    # text content before initializing so innerHTML is just the diagram
    # source, same as GitHub's own (un-nested) mermaid markup already is.
    after_body: |
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        document.querySelectorAll("pre.mermaid > code").forEach((code) => {
          code.parentElement.textContent = code.textContent;
        });
        mermaid.initialize({ startOnLoad: true });
      </script>

home:
  title: quartifyr
  description: >-
    A code-first system for generating standardized scientific/regulated
    documents with Quarto.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/installation.html
    articles:
      text: Articles
      menu:
        - text: "Architecture: two passes"
          href: articles/architecture.html
        - text: Quarto extension
          href: articles/quarto-extension.html
        - text: Styling (Python engine)
          href: articles/styling.html
        - text: The R package
          href: articles/r-package.html
        - text: Examples
          href: articles/examples.html
        - text: Templated workflows
          href: articles/templated-workflows.html
        - text: GitHub Action
          href: articles/github-action.html

reference:
  - title: Render a report
    desc: The main pass-1 + pass-2 orchestration driver.
    contents:
      - render_report
  - title: Project setup
    desc: One-time-per-project setup, alongside `reportifyr::initialize_report_project()`.
    contents:
      - initialize_quartifyr_project
      - install_quartifyr_extension
      - check_quarto_extensions
      - quartifyr_quarto_extensions
  - title: Styling engine (pyro bridge)
    desc: >-
      Thin R wrappers around the bundled Python engine
      (`inst/python/quartifyr_styling`), each also available standalone
      as a `quartifyr-styling` CLI subcommand -- except
      `styling_example_template()`, a plain file copy with no Python
      involved.
    contents:
      - starts_with("styling_")

articles:
  - title: Articles
    navbar: ~
    contents:
      - articles/installation
      - articles/architecture
      - articles/quarto-extension
      - articles/styling
      - articles/r-package
      - articles/examples
      - articles/templated-workflows
      - articles/github-action
