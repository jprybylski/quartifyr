# quartifyr-styling abbrevs (run unconditionally by render_report(), see
# r/R/render_report.R) hard-requires a non-empty top-level
# 'abbreviations:' block -- an empty map raises AbbreviationsError. Unlike
# examples/demo-report (which keeps reportifyr's full default CSR-style
# glossary), this memo's body never references any of them via \gls{}
# (only entries actually referenced end up in the rendered document --
# see styling/quartifyr_styling/abbreviations.py's docstring), so a
# couple of generic, thematically-appropriate placeholders satisfy the
# tool without carrying an unrelated pharma glossary into a business
# memo's scaffolding.
abbreviations:
 FY: fiscal year
 Q3: third fiscal quarter

figure_footnotes: {}
table_footnotes: {}
