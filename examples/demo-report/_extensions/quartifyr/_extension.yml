title: Quartifyr
author: jprybylski
version: 0.1.0
quarto-required: ">=1.6.36"
contributes:
  shortcodes:
    - appendix.lua
    - body_start.lua
  filters:
    # Order matters here for two independent reasons:
    #
    # 1. title_page.lua's Meta stage sets meta.title = nil (to suppress
    #    pandoc's own auto title-block). Filters' Meta functions run in
    #    this list's order, each seeing the previous one's output -- so
    #    synopsis.lua (which also reads meta.title, for its "Title" row)
    #    MUST run before title_page.lua, or it sees title already nulled
    #    out. Confirmed: listing it after produced an empty Title row.
    #
    # 2. signature_page.lua and title_page.lua prepend their content at
    #    position 1, so their relative order is the REVERSE of final page
    #    order: signature_page runs first and pushes itself to the front,
    #    then title_page runs and pushes itself in front of that --
    #    yielding title page, then signature/approval pages, then the
    #    rest of the document. See signature_page.lua for details.
    - synopsis.lua
    - signature_page.lua
    - title_page.lua
