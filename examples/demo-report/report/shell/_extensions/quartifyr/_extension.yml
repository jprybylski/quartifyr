title: Quartifyr
author: jprybylski
version: 0.1.0
quarto-required: ">=1.6.36"
contributes:
  shortcodes:
    - appendix.lua
  filters:
    # Both filters prepend their content at position 1, so list order here
    # is the REVERSE of final page order: signature_page runs first and
    # pushes itself to the front, then title_page runs and pushes itself
    # in front of that -- yielding title page, then signature/approval
    # pages, then the rest of the document. See signature_page.lua for
    # details.
    - signature_page.lua
    - title_page.lua
