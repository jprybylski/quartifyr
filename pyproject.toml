[project]
name = "quartifyr-styling"
version = "0.1.0"
description = "Code-first docx reference-template and abbreviations generation for quartifyr report shells"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quartifyr-styling = "quartifyr_styling.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The Python source is canonical under inst/python/ so it can be bundled
# unmodified inside the R package (see DESCRIPTION/R/run-python.R) -- this
# is the only place that path mapping is declared, don't duplicate it.
where = ["inst/python"]
include = ["quartifyr_styling*"]

[tool.setuptools.package-data]
# Bundled coding-agent skill files (issue #57) -- hand-authored Claude
# Skills-format SKILL.md content the `quartifyr-styling skills`/
# `styling_export_skills()` command copies into a target directory, kept
# structurally evergreen by tests/python/test_skills_content.py.
"quartifyr_styling" = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
